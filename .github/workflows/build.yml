name: NerfOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - i686
          - both

jobs:

  # ── Runs on every push / PR for fast feedback ─────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          bash tests/test_build_sh.sh
          bash tests/test_boot_mode.sh
          bash tests/test_nerf_optim.sh
          bash tests/test_nerf_install.sh

  # ── Compute build matrix from the arch input ──────────────────────────────
  setup-matrix:
    name: Prepare build matrix
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.arch }}" = "both" ]; then
            echo 'matrix=["x86_64","i686"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"${{ inputs.arch }}\"]" >> "$GITHUB_OUTPUT"
          fi

  # ── ISO build — runs inside Debian Trixie container ───────────────────────
  # ── --privileged required for debootstrap chroot + device nodes      ───────
  build:
    name: Build ${{ matrix.arch }} ISO
    if: github.event_name == 'workflow_dispatch'
    needs: [unit-tests, setup-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            isolinux \
            syslinux-common

      - name: Build ${{ matrix.arch }} ISO
        timeout-minutes: 60
        run: bash build/build.sh ${{ matrix.arch }}

      - name: Verify ISO
        run: |
          ls -lh output/nerf-os-1.0-${{ matrix.arch }}.iso
          file output/nerf-os-1.0-${{ matrix.arch }}.iso | grep -q "ISO 9660"
          echo "PASS: ISO is a valid ISO 9660 image"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nerf-os-1.0-${{ matrix.arch }}
          path: output/nerf-os-1.0-${{ matrix.arch }}.iso
          retention-days: 30

  # ── QEMU boot test — x86_64 only (test script uses qemu-system-x86_64) ────
  qemu-test:
    name: QEMU boot test
    if: github.event_name == 'workflow_dispatch'
    needs: [setup-matrix, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
        exclude:
          - arch: i686

    steps:
      - uses: actions/checkout@v4

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: nerf-os-1.0-${{ matrix.arch }}
          path: output/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "KVM not available — will fall back to emulation"

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: QEMU boot test
        run: bash tests/test_qemu_boot.sh output/nerf-os-1.0-${{ matrix.arch }}.iso
